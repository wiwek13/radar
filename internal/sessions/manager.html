<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar sessions</title>
<style nonce="{{NONCE}}">
  :root {
    --bg: #f7f8fa; --surface: #ffffff; --border: #e3e6eb; --text: #111827; --muted: #5b6472;
    --brand: #2563eb; --brand-text: #ffffff; --ok: #15803d; --warn: #b45309; --bad: #b91c1c; --idle: #6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --surface: #171a21; --border: #2a2f3a; --text: #e6e8ec; --muted: #9aa3b2;
      --brand: #3b82f6; --brand-text: #ffffff; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --idle: #9aa3b2;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  .focus h2 { margin: 0 0 6px; font-size: 16px; word-break: break-all; }
  .focus p { margin: 0 0 12px; color: var(--muted); }
  .error { color: var(--bad); white-space: pre-wrap; word-break: break-word; font-size: 13px; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  input[type=search] { flex: 1; min-width: 180px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; }
  button { font: inherit; border-radius: 8px; padding: 6px 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-text); }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-top: 1px solid var(--border); }
  li:first-child { border-top: 0; }
  .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .pill { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .s-running { color: var(--ok); } .s-starting, .s-stopping { color: var(--warn); } .s-failed { color: var(--bad); } .s-stopped { color: var(--idle); }
  .actions { display: flex; gap: 6px; }
  .empty { color: var(--muted); padding: 12px 4px; }
  @media (max-width: 560px) { .meta { display: none; } li { flex-wrap: wrap; } .name { flex-basis: 100%; } }
</style>
</head>
<body>
<main>
  <h1>Radar sessions</h1>
  <p class="sub">Each cluster runs in its own Radar. Tabs on different clusters never affect each other.</p>
  <section id="focus" class="card focus" hidden></section>
  <section class="card">
    <div class="toolbar">
      <input id="filter" type="search" placeholder="Filter clusters" aria-label="Filter clusters">
      <button id="stop-all" class="danger" type="button">Stop all</button>
    </div>
    <ul id="list"></ul>
  </section>
</main>
<script nonce="{{NONCE}}">
(() => {
  const api = '/_sessions/api/';
  const match = location.pathname.match(/^\/s\/([a-z0-9-]+)\//);
  const focusSlug = match ? match[1] : '';
  let sessions = [];
  let reloadWhenRunning = false;
  let busy = new Set();

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };
  const button = (label, cls, onClick) => {
    const b = el('button', cls, label);
    b.type = 'button';
    b.addEventListener('click', onClick);
    return b;
  };
  const memory = (bytes) => bytes ? Math.round(bytes / 1048576) + ' MB' : '';
  const sessionURL = (slug) => '/s/' + slug + '/';

  async function post(path, body) {
    const res = await fetch(api + path, {
      method: 'POST',
      headers: { 'X-Radar-Sessions': '1', 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || res.statusText);
    }
    return res.json();
  }

  async function act(slug, fn) {
    busy.add(slug);
    render();
    try { await fn(); } catch (e) { alert(e.message); }
    busy.delete(slug);
    await refresh();
  }

  function start(slug) {
    if (slug === focusSlug) reloadWhenRunning = true;
    return act(slug, () => post('sessions/' + slug + '/start'));
  }
  function stop(slug) {
    return act(slug, () => post('sessions/' + slug + '/stop'));
  }

  function renderFocus() {
    const box = document.getElementById('focus');
    const s = sessions.find((x) => x.slug === focusSlug);
    if (!focusSlug) { box.hidden = true; return; }
    box.hidden = false;
    box.replaceChildren();
    if (!s) {
      box.append(el('h2', '', 'Unknown cluster'), el('p', '', 'No kubeconfig context matches this address.'));
      return;
    }
    box.append(el('h2', '', s.context));
    const text = {
      stopped: 'This cluster’s session is stopped. Start it to open Radar here.',
      starting: 'Starting Radar for this cluster… this page opens it as soon as it is ready.',
      stopping: 'Stopping…',
      failed: 'This cluster’s session failed to start.',
      running: 'Running. Opening Radar…',
    }[s.state] || s.state;
    box.append(el('p', '', text));
    if (s.state === 'failed' && s.error) box.append(el('p', 'error', s.error));
    if (s.state === 'stopped' || s.state === 'failed') {
      const b = button(s.state === 'failed' ? 'Retry' : 'Start session', 'primary', () => start(s.slug));
      b.disabled = busy.has(s.slug);
      box.append(b);
    }
  }

  function renderList() {
    const list = document.getElementById('list');
    const q = document.getElementById('filter').value.trim().toLowerCase();
    list.replaceChildren();
    const shown = sessions.filter((s) => !q || s.context.toLowerCase().includes(q));
    if (!shown.length) { list.append(el('li', 'empty', 'No clusters match.')); return; }
    for (const s of shown) {
      const li = el('li');
      const name = el('span', 'name', s.context);
      name.title = s.context;
      li.append(name, el('span', 'meta', memory(s.rssBytes)), el('span', 'pill s-' + s.state, s.state));
      const actions = el('span', 'actions');
      const disabled = busy.has(s.slug) || s.state === 'starting' || s.state === 'stopping';
      if (s.state === 'running') {
        actions.append(
          button('Open', '', () => { location.href = sessionURL(s.slug); }),
          button('New tab', '', () => { window.open(sessionURL(s.slug), '_blank', 'noopener'); }),
          button('Stop', 'danger', () => stop(s.slug)),
        );
      } else if (s.state === 'stopped' || s.state === 'failed') {
        actions.append(button('Start', 'primary', () => start(s.slug)));
      }
      actions.querySelectorAll('button').forEach((b) => { b.disabled = disabled; });
      li.append(actions);
      list.append(li);
    }
  }

  function render() { renderFocus(); renderList(); }

  async function refresh() {
    try {
      const res = await fetch(api + 'state');
      const data = await res.json();
      sessions = data.sessions || [];
    } catch { return; }
    const s = sessions.find((x) => x.slug === focusSlug);
    if (s && s.state === 'starting') reloadWhenRunning = true;
    if (s && s.state === 'running' && reloadWhenRunning) { location.reload(); return; }
    render();
  }

  document.getElementById('filter').addEventListener('input', renderList);
  document.getElementById('stop-all').addEventListener('click', async () => {
    if (!confirm('Stop every running cluster session?')) return;
    try { await post('stop-all', {}); } catch (e) { alert(e.message); }
    refresh();
  });
  refresh();
  setInterval(refresh, 1500);
})();
</script>
</body>
</html>
